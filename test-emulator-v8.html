<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-DOS Emulator - Doom II</title>
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    <style>
        #dosbox {
            width: 640px;
            height: 400px;
        }
    </style>
</head>
<body>
    <div id="dosbox"></div>

    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script>
        const bundleUrl = "https://play.libe.dev/games/bundles/doom2.jsdos";

        async function startEmulator() {
            const dosbox = document.getElementById("dosbox");
            const ci = await Dos(dosbox, {
                wdosboxUrl: "https://v8.js-dos.com/latest/wdosbox.js",
                url: bundleUrl,
                autolock: true,
            });
            console.log(ci);
            ci.setTheme("dark");
            ci.setAutoStart(true);
        }

        // Start the emulator as soon as the page loads
        window.onload = startEmulator;
    </script>
</body>
</html>
